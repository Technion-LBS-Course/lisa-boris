[pytest]
# Test layers (run in order for the pyramid): unit -> integration -> e2e.
#   pytest -m "not integration and not e2e"   # fast unit layer
#   pytest -m integration                      # multi-module integration
#   pytest -m e2e                              # end-to-end Streamlit app (slow)
#   pytest                                     # everything
markers =
    integration: multi-module integration tests wiring real components on committed data
    e2e: end-to-end tests that render the real Streamlit app via streamlit.testing AppTest (slow)
