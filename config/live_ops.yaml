# Live Ops dashboard — runtime configuration (all paths are repo-relative).
# Edit these to point at a different camera / clip. Secrets (GROQ_API_KEY) stay
# in .streamlit/secrets.toml, never here.

# Prepared camera mapping config: camera metadata + >=4 reference points (anchors)
# + image zones. Same shape the Central Control "Export" produces.
camera_config: config/live_ops_camera.json

# Stable reference frame used for Setup (Place / Calibrate / Zones).
reference_frame: data/live_demo/frame-1.jpg

# Optional operational context (landmarks, sensitive receptors, contact policy) used
# only for Live incident reasoning and concise first-message generation. Both are
# optional — Live Ops runs without them. Deterministic code reads the JSON; the
# Markdown is human/LLM-readable. NO secrets here; contacts are demo/public only and
# are never treated as verified real contacts without a source in the file itself.
operational_context_json: data/live_ops/live_ops_operational_context.json
operational_context_md: data/live_ops/live_ops_operational_context.md

# Pre-extracted demo frames used by the Live tab (committed, lightweight).
frames_dir: data/live_demo/frames

# Optional: a real video to sample instead of frames_dir (git-ignored if dropped
# into data/live_demo/). Leave empty to use the committed frames.
video_path: ""

# Detection + confirmation tuning (exposed in the Live sidebar settings too).
detection_interval_sec: 1.0    # 1 sampled frame every N seconds when reading a video
confidence_threshold: 0.40     # legacy single-threshold fallback (kept for compatibility)
# Per-class confidence thresholds shown in the Live sidebar. Smoke uses a higher
# bar than fire by default. NOTE: the demo clip's smoke is faint (~0.25-0.32), so
# lower Smoke confidence in the sidebar to see the auto-detect + freeze on this clip.
smoke_confidence_threshold: 0.40
fire_confidence_threshold: 0.40
confirmation_frames: 1          # alert confirmed once >= N of the last N+1 frames are positive

# Routine "Watch" agent cadence + playback speed.
routine_report_interval_min: 30
playback_speed_ms: 700
